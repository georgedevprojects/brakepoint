name: Build BrakePoint.exe

# Runs when you publish a release on GitHub (or press "Run workflow" on the Actions tab).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name BrakePoint --add-data "report_template.html;." brakepoint_app.py

      - name: Smoke test (analyse demo laps)
        run: |
          python mock_session.py
          python analyze.py --no-open

      - name: Keep exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrakePoint
          path: dist/BrakePoint.exe

      - name: Attach exe to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BrakePoint.exe
